<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E0B">
<title>시간의 정원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#120E0B; --sand:#E9C98E; --petal:#EDE3FA; --stem:#9CCB84; --ink:#EFE6D8; --dim:#9A8F80;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--wall);color:var(--ink);overflow:hidden;
  font-family:"Gowun Batang","Noto Serif KR",serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--sand);outline-offset:3px}

/* ---------- 참여 화면 ---------- */
#input{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));
  max-width:520px;margin:0 auto;gap:22px}
#input h1,#input p,#status{word-break:keep-all}
#input h1{margin:0;font-size:clamp(26px,7vw,34px);font-weight:700;line-height:1.35;letter-spacing:-0.01em}
#input p{margin:0;font-size:16px;line-height:1.75;color:var(--dim);max-width:30em}
.scoops{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:6px}
.scoops button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(233,201,142,.45);
  background:radial-gradient(circle at 50% 62%, rgba(233,201,142,var(--fill)) 0 46%, transparent 47%);
  color:var(--ink);font-size:19px;font-weight:700;cursor:pointer;min-height:48px;
  transition:transform .12s ease,border-color .2s ease}
.scoops button:active{transform:scale(.93)}
.scoops button:disabled{opacity:.35;cursor:default}
.scoops button.picked{border-color:var(--sand);background:var(--sand);color:var(--wall)}
#status{min-height:3.2em;font-size:15px;line-height:1.6;color:var(--sand)}
.to-garden{align-self:flex-start;background:none;border:0;padding:6px 0;color:var(--ink);
  font-size:15px;text-decoration:underline;text-underline-offset:4px;cursor:pointer;opacity:.8}

/* ---------- 정원(전시) 화면 ---------- */
#show{position:fixed;inset:0;display:none;background:var(--wall)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:calc(20px + env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));
  font-size:14px;color:var(--dim);pointer-events:none;transition:opacity .6s}
#tools{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;gap:8px;transition:opacity .6s}
#tools button{background:rgba(18,14,11,.6);border:1px solid rgba(239,230,216,.3);color:var(--ink);
  border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
.idle #tools,.idle #hud{opacity:0}
</style>
</head>
<body>

<section id="input" aria-label="참여">
  <h1>오늘, 몇 명의 나로 살았나요?</h1>
  <p>집에서, 친구 곁에서, 학교와 일터에서 마주한 나의 수만큼 모래를 부어 주세요.</p>
  <div class="scoops" role="group" aria-label="부을 모래의 양">
    <button data-v="1">1</button><button data-v="2">2</button><button data-v="3">3</button><button data-v="4">4</button><button data-v="5">5</button>
    <button data-v="6">6</button><button data-v="7">7</button><button data-v="8">8</button><button data-v="9">9</button><button data-v="10">10</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <button class="to-garden" id="toShow">정원 보기</button>
</section>

<section id="show" aria-label="정원">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="tools">
    <button id="serial">센서 연결</button>
    <button id="demo">데모</button>
    <button id="full">전체 화면</button>
    <button id="toInput">참여 화면</button>
  </div>
</section>

<script>
(() => {
  // ================= 설정 =================
  const COOLDOWN_MS = 6000;
  const COOLDOWN_KEY = "garden-last-pour";
  const MAX_LAYERS = 7;          // 정원이 뒤로 깊어지는 단계 수
  const MAX_SAND = 1600;          // 동시에 떨어지는 모래알 수
  const MAX_SETTLED = 6000;       // 땅에 쌓여 반짝이는 모래알 수
  const INSTANT_IF_OLDER_MS = 15000;   // 이보다 오래된 입력은 이미 자란 꽃으로 심음
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 꽃의 색: 관람객마다 고유한 씨앗
  const HUES = [[222,200,255],[255,205,225],[255,226,170],[205,232,255],[255,245,235]];
  // 꽃 모양 5가지: 꽃잎 수(k)와 꽃잎 폭(wf)
  const SHAPES = [
    { name: "물방울", k: 6, wf: 0.42 },
    { name: "튤립", k: 5, wf: 0.62 },
    { name: "데이지", k: 10, wf: 0.2 },
    { name: "코스모스", k: 8, wf: 0.4 },
    { name: "크로커스", k: 6, wf: 0.3 }
  ];
  // 센서 무게 → 스쿱 수 환산 (한 스쿱 무게, 주소 뒤 ?scoop=8 처럼 바꿀 수 있음)
  const SCOOP_G = Number(new URLSearchParams(location.search).get("scoop")) || 8;
  const MIN_G = 2;   // 이보다 가벼우면 잘못된 신호로 보고 꽃을 피우지 않음
  // 무게 구간 → 꽃의 모습 (값은 화면 단위 u 기준)
  const TIERS = {
    1: { h: 95,  pl: 18, sp: 30, open: 0.18 },   // 1~2 스쿱: 새싹과 봉오리
    2: { h: 145, pl: 32, sp: 38, open: 0.75 },   // 3~4 스쿱: 작은 꽃
    3: { h: 195, pl: 44, sp: 46, open: 0.92 },   // 5~6 스쿱: 중간 꽃
    4: { h: 255, pl: 62, sp: 56, open: 1.0 }     // 7 스쿱 이상: 시그니처 꽃
  };
  const tierOf = v => v <= 2 ? 1 : v <= 4 ? 2 : v <= 6 ? 3 : 4;

  // ================= 요소 =================
  const inputEl = document.getElementById("input");
  const showEl = document.getElementById("show");
  const statusEl = document.getElementById("status");
  const hudEl = document.getElementById("hud");
  const buttons = [...document.querySelectorAll(".scoops button")];
  const canvas = document.getElementById("c");
  const ctx = canvas.getContext("2d");
  buttons.forEach(b => {
    const v = Number(b.dataset.v);
    b.style.setProperty("--fill", (0.08 + 0.07 * v).toFixed(2));
    if (v >= 7) b.style.color = "#120E0B";
  });

  let showing = false;
  function setShow(on) {
    showing = on;
    inputEl.style.display = on ? "none" : "flex";
    showEl.style.display = on ? "block" : "none";
    if (on) { resize(); poke(); }
  }
  document.getElementById("toShow").addEventListener("click", () => setShow(true));
  document.getElementById("toInput").addEventListener("click", () => setShow(false));
  document.getElementById("demo").addEventListener("click", () => enqueue(1 + Math.floor(Math.random() * 10), Date.now()));
  document.getElementById("full").addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen(); else showEl.requestFullscreen?.();
  });

  // 전시 중에는 조작 버튼을 숨김 (움직이면 다시 보임)
  let idleTimer = 0;
  function poke() {
    showEl.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => showEl.classList.add("idle"), 4000);
  }
  ["pointermove", "pointerdown", "keydown"].forEach(ev => window.addEventListener(ev, () => { if (showing) poke(); }));
  window.addEventListener("keydown", e => {
    if (!showing) return;
    if (/^[0-9]$/.test(e.key)) enqueue(e.key === "0" ? 10 : Number(e.key), Date.now());
    if (e.key === "f") document.getElementById("full").click();
  });

  // ================= 참여 입력 =================
  function cooldownLeft() {
    try { return Math.max(0, COOLDOWN_MS - (Date.now() - Number(localStorage.getItem(COOLDOWN_KEY) || 0))); }
    catch (e) { return 0; }
  }
  buttons.forEach(btn => btn.addEventListener("click", async () => {
    const v = Number(btn.dataset.v);
    const left = cooldownLeft();
    if (left > 0) { statusEl.textContent = `다음 모래는 ${Math.ceil(left / 1000)}초 뒤에 부을 수 있어요.`; return; }
    buttons.forEach(b => b.disabled = true);
    btn.classList.add("picked");
    try { localStorage.setItem(COOLDOWN_KEY, String(Date.now())); } catch (e) {}
    try {
      if (window.gardenRemote) {
        await window.gardenRemote.send(v);
        statusEl.textContent = `${v}명의 나를 부었어요. 정원에 모래가 내립니다.`;
      } else {
        enqueue(v, Date.now());
        statusEl.textContent = `${v}명의 나를 부었어요.`;
        setTimeout(() => setShow(true), 700);
      }
    } catch (err) {
      console.error(err);
      statusEl.textContent = "보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. (" + ((err && (err.code || err.message)) || "오류") + ")";
    } finally {
      setTimeout(() => { buttons.forEach(b => { b.disabled = false; b.classList.remove("picked"); }); }, COOLDOWN_MS);
    }
  }));

  // ================= 화면 =================
  let W = 0, H = 0, DPR = 1, u = 1, gyFront = 0;
  let soil = [];
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    u = Math.min(H, W * 1.6) / 900;
    gyFront = H * 0.76;
    buildBackdrop();
  }
  window.addEventListener("resize", () => { if (showing) resize(); });

  const gy = r => gyFront - r * H * 0.035;          // 층마다 땅이 조금씩 뒤(위)로
  const scaleOf = r => Math.pow(0.84, r);
  const alphaOf = r => Math.pow(0.88, r);
  const zoomFor = r => Math.max(0.62, 1 - 0.07 * r);

  // ---- 모래가 쌓여 만들어지는 땅 (가로 칸마다 쌓인 높이) ----
  const BINS = 180;
  const height = new Float32Array(BINS);
  let hx0 = 0, hx1 = 1, MAXH = 34;
  const binOf = x => Math.max(0, Math.min(BINS - 1, Math.floor((x - hx0) / (hx1 - hx0) * BINS)));
  const groundY = (x, r) => gy(r) - height[binOf(x)] * scaleOf(r);
  function addSand(x, amt) {
    const b = binOf(x);
    for (let k = -4; k <= 4; k++) {
      const i = b + k; if (i < 0 || i >= BINS) continue;
      height[i] = Math.min(MAXH, height[i] + amt * (1 - Math.abs(k) / 5));
    }
  }
  function settle(x, r) {
    const p = { x, y: groundY(x, r) + Math.random() * 7 * u * scaleOf(r),
      s: (0.6 + Math.random() * 1.6) * u * scaleOf(r), a: 0.3 + Math.random() * 0.6,
      w: 0.5 + Math.random() * 2.5, p: Math.random() * 6.28 };
    if (soil.length < MAX_SETTLED) soil.push(p); else soil[Math.floor(Math.random() * MAX_SETTLED)] = p;
  }

  function buildBackdrop() {
    hx0 = W / 2 - W / (2 * 0.62); hx1 = W / 2 + W / (2 * 0.62);
    MAXH = 34 * u;
  }

  // 미리 그려둔 꽃잎·빛 스프라이트 (색마다 하나씩)
  function petalPath(g, shape) {
    g.beginPath(); g.moveTo(32, 126);
    if (shape === 0) { g.bezierCurveTo(2, 100, 6, 30, 32, 2); g.bezierCurveTo(58, 30, 62, 100, 32, 126); }
    else if (shape === 1) { g.bezierCurveTo(-4, 90, 2, 6, 32, 6); g.bezierCurveTo(62, 6, 68, 90, 32, 126); }
    else if (shape === 2) { g.bezierCurveTo(14, 90, 20, 10, 32, 4); g.bezierCurveTo(44, 10, 50, 90, 32, 126); }
    else if (shape === 3) { g.bezierCurveTo(0, 90, 4, 10, 18, 6); g.quadraticCurveTo(28, 6, 32, 18); g.quadraticCurveTo(36, 6, 46, 6); g.bezierCurveTo(60, 10, 64, 90, 32, 126); }
    else { g.bezierCurveTo(10, 100, 14, 40, 32, 0); g.bezierCurveTo(50, 40, 54, 100, 32, 126); }
  }
  function makePetal(rgb, shape) {
    const c = document.createElement("canvas"); c.width = 64; c.height = 128;
    const g = c.getContext("2d");
    const grad = g.createLinearGradient(0, 128, 0, 0);
    grad.addColorStop(0, "rgba(255,255,255,0.8)");
    grad.addColorStop(0.35, `rgba(${rgb},0.6)`);
    grad.addColorStop(1, `rgba(${rgb},0.12)`);
    g.fillStyle = grad;
    petalPath(g, shape);
    g.fill();
    g.strokeStyle = "rgba(255,255,255,0.45)"; g.lineWidth = 2; g.stroke();
    return c;
  }
  function makeGlow(rgb) {
    const c = document.createElement("canvas"); c.width = c.height = 64;
    const g = c.getContext("2d");
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, "rgba(255,255,250,1)");
    grad.addColorStop(0.25, `rgba(${rgb},0.55)`);
    grad.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
    return c;
  }
  const PETAL = SHAPES.map((_, si) => HUES.map(h => makePetal(h.join(","), si)));
  const GLOW = HUES.map(h => makeGlow(h.join(",")));
  const SPARK = makeGlow("233,201,142");

  // ================= 정원 상태 =================
  const plots = [];           // 관람객 한 명의 작은 정원
  const occupied = [];        // 층별 차지한 구간
  for (let r = 0; r < MAX_LAYERS; r++) occupied.push([]);
  let maxLayer = 0, zoom = 1, flowerCount = 0;
  const grains = [], splashes = [];
  const queue = [];
  let pour = null;            // 지금 모래가 내리는 중

  const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  const hashHue = t => Math.abs(Math.floor(t / 7) * 2654435761 % HUES.length);
  const hashShape = t => Math.abs(Math.floor(t / 13) * 2246822519 % SHAPES.length);

  function placePlot(v) {
    const T = TIERS[tierOf(v)];
    for (let r = 0; r < MAX_LAYERS; r++) {
      const s = scaleOf(r);
      const width = ((v - 1) * T.sp + 50) * u * s;
      const half = W / (2 * zoomFor(r)) - 24 * u;
      const lo = W / 2 - half + width / 2, hi = W / 2 + half - width / 2;
      if (hi <= lo) continue;
      for (let k = 0; k < 40; k++) {
        const x = lo + Math.random() * (hi - lo);
        const a = x - width / 2 - 8 * u * s, b = x + width / 2 + 8 * u * s;
        if (!occupied[r].some(o => a < o[1] && b > o[0])) {
          occupied[r].push([a, b]);
          return { x, layer: r };
        }
      }
    }
    const r = 2 + Math.floor(Math.random() * (MAX_LAYERS - 2));
    const half = W / (2 * zoomFor(r)) - 40 * u;
    return { x: W / 2 - half + Math.random() * half * 2, layer: r };
  }

  function makePlot(v, t, spot) {
    const tier = tierOf(v), T = TIERS[tier];
    const flowers = [];
    const tallest = Math.floor(Math.random() * v);
    const order = [...Array(v).keys()].sort(() => Math.random() - 0.5);
    for (let i = 0; i < v; i++) {
      flowers.push({
        dx: (i - (v - 1) / 2) * T.sp * u * (0.85 + Math.random() * 0.3),
        h: T.h * u * (i === tallest ? 1.08 : 0.7 + Math.random() * 0.25),
        pl: T.pl * u * (0.85 + Math.random() * 0.3),
        open: T.open,
        bend: (Math.random() - 0.5) * 0.25,
        phase: Math.random() * 6.28,
        delay: order.indexOf(i) * 0.28 + Math.random() * 0.25
      });
    }
    return { v, t, x: spot.x, layer: spot.layer, hue: hashHue(t), shape: hashShape(t), flowers, born: Infinity };
  }

  function plant(plot, instant) {
    plot.born = instant ? performance.now() / 1000 - 30 : performance.now() / 1000;
    plot.instant = instant;
    if (instant) {
      const spread = (plot.v * 18 + 60) * u * scaleOf(plot.layer);
      for (let k = 0; k < 90 + plot.v * 50; k++) {
        const x = plot.x + (Math.random() - 0.5) * spread * 2;
        addSand(x, 0.03 * u);
        if (k % 2 === 0) settle(x, plot.layer + Math.random() * 0.8);
      }
      for (let k = 0; k < 40; k++) { const x = hx0 + Math.random() * (hx1 - hx0); addSand(x, 0.02 * u); settle(x, Math.random() * (maxLayer + 1)); }
    }
    plots.push(plot);
    plots.sort((a, b) => b.layer - a.layer);
    flowerCount += plot.v;
    maxLayer = Math.max(maxLayer, plot.layer);
  }

  // 입력 하나 = 모래 한 번 + 작은 정원 하나
  function enqueue(v, t, instant = false) {
    v = Math.min(10, Math.max(1, Math.round(v)));
    if (instant) { plant(makePlot(v, t, placePlot(v)), true); return; }
    queue.push({ v, t });
  }

  // 센서 연결용 (아두이노 → 웹)
  const sentTs = new Set();            // 이 화면이 직접 저장한 입력 (Firebase에서 다시 받아도 중복으로 심지 않음)
  window.garden = {
    // 모래가 흐르기 시작 → 화면에 모래가 내림
    flowStart() { if (!pour) pour = { v: null, start: performance.now() / 1000, until: Infinity, plot: null, sensor: true }; },
    // 모래가 멈춤 → 방금 부은 무게(g)로 스쿱 수를 정하고 꽃을 피움
    flowEndGrams(g) {
      g = Number(g) || 0;
      if (g < MIN_G) { if (pour && pour.sensor && !pour.plot) pour = null; return; }
      this.flowEnd(g / SCOOP_G);
    },
    flowEnd(v) {
      v = Math.min(10, Math.max(1, Math.round(v || 1)));
      const t = Date.now();
      if (!pour) pour = { start: performance.now() / 1000 };
      pour.v = v; pour.plot = makePlot(v, t, placePlot(v)); pour.until = performance.now() / 1000 + 0.6;
      if (window.gardenRemote) { sentTs.add(t); window.gardenRemote.sendAt(v, t).catch(e => console.error(e)); }
    },
    plant: v => enqueue(v, Date.now()),
    // 발표·테스트용: 이미 자란 정원 n개를 바로 채움 (주소 뒤 ?seed=20)
    seed(n) { for (let i = 0; i < n; i++) enqueue(1 + Math.floor(Math.random() * 10), Date.now() - 60000 - i * 1000, true); }
  };

  // 센서가 '시작'만 보내고 끝을 못 보낸 경우 40초 뒤 정리
  setInterval(() => { if (pour && pour.sensor && !pour.plot && performance.now() / 1000 - pour.start > 40) pour = null; }, 2000);

  // ---- 아두이노 USB 연결 (Web Serial, 크롬·엣지) ----
  // 아두이노가 한 줄씩 보내는 신호:  START  /  END,12.3  (12.3 = 방금 부은 모래 g)
  function handleLine(line) {
    const [cmd, val] = line.trim().split(",");
    if (cmd === "START") window.garden.flowStart();
    else if (cmd === "END") window.garden.flowEndGrams(parseFloat(val));
    else if (cmd === "W") sensorStatus = `무게 ${parseFloat(val).toFixed(1)}g`;
  }
  let sensorStatus = "";
  async function openPort(port) {
    await port.open({ baudRate: 9600 });
    sensorStatus = "센서 연결됨";
    document.getElementById("serial").textContent = "센서 연결됨";
    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable).catch(() => {});
    const reader = decoder.readable.getReader();
    let buf = "";
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += value;
        let i;
        while ((i = buf.indexOf("\n")) >= 0) { handleLine(buf.slice(0, i)); buf = buf.slice(i + 1); }
      }
    } catch (e) { console.error(e); }
    sensorStatus = "센서 연결이 끊겼어요. 다시 연결해 주세요.";
    document.getElementById("serial").textContent = "센서 연결";
  }
  async function connectSerial() {
    if (!("serial" in navigator)) { sensorStatus = "센서 연결은 크롬이나 엣지에서만 돼요."; return; }
    try { await openPort(await navigator.serial.requestPort()); }
    catch (e) { if (e.name !== "NotFoundError") { sensorStatus = "센서를 열지 못했어요. 시리얼 모니터가 켜져 있으면 닫고 다시 눌러 주세요."; console.error(e); } }
  }
  document.getElementById("serial").addEventListener("click", connectSerial);
  // 한 번 허락한 아두이노는 다음부터 자동으로 연결
  if ("serial" in navigator) navigator.serial.getPorts().then(ps => { if (ps[0]) openPort(ps[0]).catch(() => {}); });

  function nextPour(now) {
    if (pour || !queue.length) return;
    const q = queue.shift();
    const plot = makePlot(q.v, q.t, placePlot(q.v));
    pour = { v: q.v, start: now, until: now + 2.6 + q.v * 0.55, plot };
  }

  // ================= 업데이트 =================
  function toScreen(x, y) {
    return [W / 2 + (x - W / 2) * zoom, gyFront + (y - gyFront) * zoom];
  }

  function update(dt, now) {
    nextPour(now);
    zoom += (zoomFor(maxLayer) - zoom) * Math.min(1, dt * 0.6);

    // 모래는 붓는 동안에만 내림 (다 붓고 나면 화면은 고요하게)
    let rate = 0;
    let focusX = null;
    if (pour) {
      const fade = pour.until === Infinity ? 1 : Math.min(1, Math.max(0, (pour.until - now) / 0.8));
      const rise = Math.min(1, (now - pour.start) / 0.6);
      rate += (reduceMotion ? 50 : 150 + (pour.v || 5) * 30) * Math.min(fade, rise);
      if (pour.plot) focusX = pour.plot.x;
    }
    const topY = gyFront - gyFront / zoom;                 // 화면 맨 위의 정원 좌표
    const half = W / (2 * zoom);
    const n = Math.floor(rate * dt + Math.random());
    for (let i = 0; i < n && grains.length < MAX_SAND; i++) {
      const near = focusX !== null && Math.random() < 0.5;
      const x = near ? focusX + (Math.random() - 0.5) * 240 * u : W / 2 - half + Math.random() * half * 2;
      const r = near && pour.plot ? pour.plot.layer + Math.random() * 0.8 : Math.random() * (maxLayer + 1);
      grains.push({
        x, y: topY - Math.random() * H * 0.25, r,
        vy: (320 + Math.random() * 360) * u, drift: (Math.random() - 0.5) * 10 * u,
        trail: (14 + Math.random() * 46) * u, a: 0.35 + Math.random() * 0.55,
        s: (1.2 + Math.random() * 2.2) * u
      });
    }
    for (let i = grains.length - 1; i >= 0; i--) {
      const g = grains[i];
      g.y += g.vy * dt; g.x += g.drift * dt;
      const floor = groundY(g.x, g.r);
      if (g.y >= floor) {
        addSand(g.x, 0.035 * u);
        settle(g.x, g.r);
        if (splashes.length < 500 && Math.random() < 0.5)
          splashes.push({ x: g.x, y: floor, life: 0.4 + Math.random() * 0.4, age: 0, vx: (Math.random() - 0.5) * 30 * u, vy: -(15 + Math.random() * 35) * u });
        grains.splice(i, 1);
      }
    }
    for (let i = splashes.length - 1; i >= 0; i--) {
      const p = splashes[i];
      p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * u * dt;
      if (p.age >= p.life) splashes.splice(i, 1);
    }

    // 모래가 멈추면 그 자리에서 꽃이 돋아남
    if (pour && now >= pour.until && pour.plot) {
      plant(pour.plot, false);
      pour = null;
    }
  }

  // ================= 그리기 =================
  function drawFlower(f, plot, now, s, la) {
    const age = now - plot.born - (plot.instant ? 0 : f.delay);
    if (age < 0) return;
    const grow = ease(age / 2.2);
    const bloom = ease((age - 1.6) / 2.4) * f.open;
    const x0 = plot.x + f.dx * s, y0 = groundY(x0, plot.layer);
    const h = f.h * s * grow;
    const sway = reduceMotion ? 0 : Math.sin(now * 0.8 + f.phase) * 0.04 * h;
    const tx = x0 + sway, ty = y0 - h;

    // 줄기
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = `rgba(156,203,132,${0.7 * la})`;
    ctx.lineWidth = Math.max(1, 2.2 * u * s);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.quadraticCurveTo(x0 + f.bend * h, y0 - h * 0.5, tx, ty);
    ctx.stroke();

    // 잎
    if (grow > 0.4) {
      const lg = ease((grow - 0.4) / 0.6);
      ctx.fillStyle = `rgba(130,190,110,${0.42 * la})`;
      [[0.32, -1], [0.52, 1]].forEach(([t, side]) => {
        const lx = x0 + (f.bend * h) * t * 1.2 + sway * t, ly = y0 - h * t;
        const len = f.h * s * 0.2 * lg;
        ctx.save(); ctx.translate(lx, ly); ctx.rotate(side > 0 ? -0.6 : Math.PI + 0.6);
        ctx.beginPath(); ctx.ellipse(len * 0.5, 0, len * 0.5, len * 0.17, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      });
    }

    // 꽃 (또는 봉오리)
    if (grow > 0.85) {
      const b = Math.max(0.06, bloom);
      const len = f.pl * s * (0.4 + 0.6 * b);
      const SH = SHAPES[plot.shape];
      const wid = len * SH.wf;
      const spread = 0.1 + 0.95 * b;
      const g = GLOW[plot.hue];
      const gr = len * (0.8 + 0.4 * b);
      ctx.globalAlpha = la * (0.1 + 0.22 * b);
      ctx.drawImage(g, tx - gr, ty - gr * 0.9, gr * 2, gr * 2);
      const P = PETAL[plot.shape][plot.hue];
      ctx.save(); ctx.translate(tx, ty);
      for (let i = 0; i < SH.k; i++) {
        const a = -spread * (SH.k > 7 ? 1.25 : 1) + (2 * spread * (SH.k > 7 ? 1.25 : 1) * i) / (SH.k - 1);
        ctx.globalAlpha = la * 0.7;
        ctx.save(); ctx.rotate(a); ctx.drawImage(P, -wid / 2, -len, wid, len); ctx.restore();
      }
      ctx.restore();
      ctx.globalAlpha = la * 0.9;
      const cr = Math.max(2, len * 0.16);
      ctx.drawImage(g, tx - cr, ty - cr, cr * 2, cr * 2);
    }
    ctx.globalAlpha = 1;
  }

  function draw(now) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#120E0B";
    ctx.fillRect(0, 0, W, H);


    // 정원 세계 (줌 적용)
    const z = zoom;
    ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (W / 2 - (W / 2) * z), DPR * (gyFront - gyFront * z));

    // 쌓인 모래 언덕의 은은한 빛 (모래가 쌓인 만큼만 보임)
    for (let r = Math.min(maxLayer, MAX_LAYERS - 1); r >= 0; r--) {
      const base = gy(r), sc = scaleOf(r);
      const grad = ctx.createLinearGradient(0, base - MAXH * sc, 0, base + 30 * u * sc);
      grad.addColorStop(0, `rgba(233,201,142,${0.10 * alphaOf(r)})`);
      grad.addColorStop(1, "rgba(233,201,142,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(hx0, base + 30 * u * sc);
      for (let i = 0; i <= BINS; i++) {
        const x = hx0 + (hx1 - hx0) * i / BINS;
        ctx.lineTo(x, base - height[Math.min(BINS - 1, i)] * sc);
      }
      ctx.lineTo(hx1, base + 30 * u * sc);
      ctx.closePath();
      ctx.fill();
    }

    // 반짝이는 흙
    for (const p of soil) {
      const a = p.a * (reduceMotion ? 0.7 : 0.45 + 0.55 * Math.sin(now * p.w + p.p));
      if (a <= 0.02) continue;
      ctx.globalAlpha = a;
      ctx.drawImage(SPARK, p.x - p.s * 2, p.y - p.s * 2, p.s * 4, p.s * 4);
    }
    ctx.globalAlpha = 1;

    // 꽃 (뒤 층부터)
    for (const plot of plots) {
      const s = scaleOf(plot.layer), la = alphaOf(plot.layer);
      for (const f of plot.flowers) drawFlower(f, plot, now, s, la);
    }

    // 떨어지는 모래 (꼬리 + 반짝이는 알갱이)
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = "rgba(255,232,190,0.22)";
    ctx.lineWidth = Math.max(0.8, 1 * u);
    ctx.beginPath();
    for (const g of grains) { ctx.moveTo(g.x, g.y - g.trail); ctx.lineTo(g.x, g.y); }
    ctx.stroke();
    for (const g of grains) {
      ctx.globalAlpha = g.a;
      ctx.drawImage(SPARK, g.x - g.s * 2, g.y - g.s * 2, g.s * 4, g.s * 4);
    }
    for (const p of splashes) {
      ctx.globalAlpha = (1 - p.age / p.life) * 0.8;
      const sz = 4 * u;
      ctx.drawImage(SPARK, p.x - sz / 2, p.y - sz / 2, sz, sz);
    }
    ctx.globalAlpha = 1;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // 방금 피어난 정원의 이름
    ctx.globalCompositeOperation = "source-over";
    ctx.textAlign = "center";
    for (const plot of plots) {
      if (plot.instant) continue;
      const age = now - plot.born;
      if (age < 1.5 || age > 7.5) continue;
      const a = Math.min(1, (age - 1.5) / 0.8) * Math.min(1, (7.5 - age) / 1.2);
      const sx = toScreen(plot.x, 0)[0];
      const sy = toScreen(0, gyFront)[1] + 52 * u;
      ctx.fillStyle = `rgba(239,230,216,${0.85 * a})`;
      ctx.font = `${Math.round(Math.max(13, 16 * u))}px "Gowun Batang", serif`;
      ctx.fillText(`오늘, ${plot.v}명의 나`, sx, sy);
    }
  }

  // ================= 루프 =================
  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    if (showing) {
      const now = t / 1000;
      update(dt, now);
      draw(now);
      hudEl.textContent = `정원에 핀 꽃 ${flowerCount}송이, 함께한 사람 ${plots.length}명` + (sensorStatus ? `  ·  ${sensorStatus}` : "");
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ================= 원격 입력 (Firebase) =================
  let listening = false;
  function listen() {
    if (listening || !window.gardenRemote) return;
    listening = true;
    let first = true;
    window.gardenRemote.listen(docs => {
      const list = docs
        .filter(d => d && typeof d.v === "number" && typeof d.t === "number")
        .sort((a, b) => a.t - b.t);
      for (const d of list) {
        if (sentTs.has(d.t)) continue;
        const old = Date.now() - d.t > INSTANT_IF_OLDER_MS;
        enqueue(d.v, d.t, first && old);
      }
      first = false;
    }, err => { listening = false; hudEl.textContent = "연결이 끊겼어요. 새로고침해 주세요."; console.error(err); });
  }
  window.addEventListener("gardenRemoteReady", listen);

  resize();
  const seedN = Number(new URLSearchParams(location.search).get("seed") || 0);
  if (seedN > 0) window.garden.seed(Math.min(150, seedN));
  if (location.hash === "#show" || new URLSearchParams(location.search).has("show")) setShow(true);
  listen();
})();
</script>

    authDomain: "sand-of-time-d2bbe.firebaseapp.com",
    projectId: "sand-of-time-d2bbe",
    storageBucket: "sand-of-time-d2bbe.firebasestorage.app",
    messagingSenderId: "1009594124584",
    appId: "1:1009594124584:web:88bcf57292a4e0d5b6a81d"
  };
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  try {
    const db = getFirestore(initializeApp(firebaseConfig));
    window.gardenRemote = {
      send: v => addDoc(collection(db, "entries"), { v, t: Date.now() }),
      sendAt: (v, t) => addDoc(collection(db, "entries"), { v, t }),
      listen: (onDocs, onErr) => {
        const q = query(collection(db, "entries"), orderBy("t", "desc"), limit(150));
        onSnapshot(q, snap => {
          onDocs(snap.docChanges().filter(ch => ch.type === "added").map(ch => ch.doc.data()));
        }, onErr);
      }
    };
    window.dispatchEvent(new Event("gardenRemoteReady"));
  } catch (err) {
    console.error("Firebase 연결 실패", err);
  }
</script>
